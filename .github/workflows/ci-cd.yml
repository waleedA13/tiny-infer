name: CI/CD

# One workflow, four jobs in a row, so the run page shows them as a diagram:
#
#   build-and-test -> sanitizers -> package -> release
#
# Pushes and PRs to main run the first two. Pushing a tag like v0.1.0
# runs all four and puts the binaries on a GitHub release.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: make
      - name: Run self-tests
        run: make test

  # Same tests again with the address and undefined behavior sanitizers on.
  sanitizers:
    needs: build-and-test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Build with sanitizers
        run: make debug
      - name: Run self-tests
        run: ./tiny-infer --selftest

  # Only runs for v* tags. On everything else it shows up as skipped.
  package:
    needs: sanitizers
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform_name: linux-x86_64
          - os: macos-latest
            platform_name: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      # Plain make, not make fast. -march=native would tie the binary to the
      # CPU of the build machine and it might crash on someone else's.
      - name: Build
        run: make
      - name: Package
        run: |
          archive_name="tiny-infer-${GITHUB_REF_NAME}-${{ matrix.platform_name }}.tar.gz"
          tar -czf "$archive_name" tiny-infer README.md
          echo "ARCHIVE_NAME=$archive_name" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE_NAME }}
          path: ${{ env.ARCHIVE_NAME }}

  release:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.tar.gz --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
