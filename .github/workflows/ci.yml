name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Build
        run: make

      - name: Run self-tests
        run: make test

      # Same tests again with the address and undefined behavior sanitizers on.
      # make clean first, otherwise make thinks the binary is already up to date.
      - name: Run self-tests with sanitizers
        run: |
          make clean
          make debug
          ./tiny-infer --selftest
