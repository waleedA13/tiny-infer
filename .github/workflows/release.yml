name: Release

# Push a tag like v0.1.0 and this builds the binary for Linux and macOS
# and attaches both to a GitHub release for that tag.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform_name: linux-x86_64
          - os: macos-latest
            platform_name: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      # Plain make, not make fast. -march=native would tie the binary to the
      # CPU of the build machine and it might crash on someone else's.
      - name: Build and test
        run: |
          make
          make test

      - name: Package
        run: |
          archive_name="tiny-infer-${GITHUB_REF_NAME}-${{ matrix.platform_name }}.tar.gz"
          tar -czf "$archive_name" tiny-infer README.md
          echo "ARCHIVE_NAME=$archive_name" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE_NAME }}
          path: ${{ env.ARCHIVE_NAME }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.tar.gz --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
